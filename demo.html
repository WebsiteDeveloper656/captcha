<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAPTCHA Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        #captchaImage {
            width: 200px;
            height: 70px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }

        input {
            width: 200px;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #verifyBtn {
            background: green;
            color: white;
        }

        #refreshBtn {
            background: blue;
            color: white;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>CAPTCHA Verification</h2>

    <img id="captchaImage" alt="CAPTCHA">

    <br>

    <input
        id="captchaInput"
        type="text"
        placeholder="Enter CAPTCHA"
        autocomplete="off">
    <br>
    <button id="verifyBtn" onclick="verifyCaptcha()">
        Verify
    </button>

    <button id="refreshBtn" onclick="loadCaptcha()">
        Refresh
    </button>
<div id="result"></div>
</div>


<script>

const API_URL = "";

const API_KEY = {{ api_key | tojson }};

let captchaId = "";


async function loadCaptcha() {

    const result = document.getElementById("result");

    result.innerText = "Loading CAPTCHA...";

    document.getElementById("captchaInput").value = "";

    try {

        const response = await fetch(
            API_URL + "/captcha/create",
            {
                method: "POST",
                headers: {
                    "X-API-Key": API_KEY
                }
            }
        );

        const data = await response.json();

        console.log("CREATE:", data);


        if (!data.success) {

            result.innerText =
                "❌ CAPTCHA create failed: " + data.error;

            return;
        }


        captchaId = data.captcha_id;


        const image =
            document.getElementById("captchaImage");
        const imageResponse = await fetch(
    API_URL +
    "/captcha/image/" +
    captchaId +
    "?t=" +
    Date.now(),
    {
        headers: {
            "X-API-Key": API_KEY
        }
    }
);


if (!imageResponse.ok) {

    result.innerText =
        "❌ CAPTCHA image load failed";

    return;
}


const imageBlob =
    await imageResponse.blob();


const imageUrl =
    URL.createObjectURL(imageBlob);


image.src = imageUrl;

        result.innerText = "";

    }
    catch (error) {

        console.error(error);

        result.innerText =
            "❌ Server connection error";

    }

}


async function verifyCaptcha() {

    const answer =
        document
        .getElementById("captchaInput")
        .value
        .trim();


    if (!captchaId) {

        document.getElementById("result").innerText =
            "❌ First load CAPTCHA";

        return;
    }


    if (!answer) {

        document.getElementById("result").innerText =
            "⚠️ Please enter CAPTCHA";

        return;
    }


    try {

        const response = await fetch(
            API_URL + "/captcha/verify",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "X-API-Key": API_KEY
                },

                body: JSON.stringify({

                    captcha_id: captchaId,

                    answer: answer

                })
            }
        );


        const data = await response.json();

        console.log("VERIFY:", data);


        if (data.verified) {

            document.getElementById("result").innerText =
                "✅ CAPTCHA Verified";

        }
        else {

            document.getElementById("result").innerText =
                "❌ Incorrect CAPTCHA";

        }

    }
    catch (error) {

        console.error(error);

        document.getElementById("result").innerText =
            "❌ Verification server error";

    }

}


loadCaptcha();

</script>

</body>
</html>
